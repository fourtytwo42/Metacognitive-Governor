[workspace]
resolver = "3"
members = [
    "apps/mcg-cli",
    "apps/mcg-daemon",
    "apps/mcg-shadow-runner",
    "apps/desktop/src-tauri",
    "crates/mcg-api",
    "crates/mcg-agents",
    "crates/mcg-config",
    "crates/mcg-domain",
    "crates/mcg-events",
    "crates/mcg-mcp",
    "crates/mcg-policy",
    "crates/mcg-plugins",
    "crates/mcg-projects",
    "crates/mcg-providers",
    "crates/mcg-runtime",
    "crates/mcg-storage",
    "crates/mcg-tools",
]
default-members = [
    "apps/mcg-cli",
    "apps/mcg-daemon",
    "apps/mcg-shadow-runner",
    "crates/mcg-api",
    "crates/mcg-agents",
    "crates/mcg-config",
    "crates/mcg-domain",
    "crates/mcg-events",
    "crates/mcg-mcp",
    "crates/mcg-policy",
    "crates/mcg-plugins",
    "crates/mcg-projects",
    "crates/mcg-providers",
    "crates/mcg-runtime",
    "crates/mcg-storage",
    "crates/mcg-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.93"

[workspace.dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22.1"
cap-std = "4.0.2"
chrono = { version = "0.4.42", features = ["serde"] }
chromiumoxide = "0.9.1"
clap = { version = "4.6.6", features = ["derive"] }
enigo = "0.6.1"
eventsource-stream = "0.2.3"
futures-core = "0.3.32"
futures-util = "0.3.32"
fs2 = "0.4.3"
http-body-util = "0.1.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
keyring = "4.1.5"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
screenshots = "0.8.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
subtle = "2.6.1"
sysinfo = "0.38.3"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.2"
thiserror = "2.0.20"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
url = "2.5.8"
wasmtime = { version = "=45.0.3", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "=45.0.3", default-features = false, features = ["p1"] }
webbrowser = "1.0.6"
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# `screenshots` accepts the current xcb 1.x API. Use upstream's audited branch
# until crates.io publishes the quick-xml build-dependency fix.
[patch.crates-io]
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb.git", rev = "ad8cd4c07a769148a16ddec509f5f341f5058f00" }
