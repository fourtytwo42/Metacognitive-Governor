[package]
name = "mcg-action-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["executor"]
executor = ["dep:cap-fs-ext", "dep:cap-std"]

[dependencies]
base64.workspace = true
cap-fs-ext = { workspace = true, optional = true }
cap-std = { workspace = true, optional = true }
chrono.workspace = true
process-wrap.workspace = true
mcg-contracts = { path = "../../crates/mcg-contracts" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "mcg-action-runner"
path = "src/main.rs"
required-features = ["executor"]

[[bin]]
name = "mcg-action-runner-fault-fixture"
path = "src/bin/fault_fixture.rs"
required-features = ["executor"]
test = false
bench = false

[lints]
workspace = true
