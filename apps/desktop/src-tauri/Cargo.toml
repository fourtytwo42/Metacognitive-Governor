[package]
name = "mcg-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "mcg_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
single-file-portable = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
mcg-agents = { path = "../../../crates/mcg-agents" }
mcg-api = { path = "../../../crates/mcg-api" }
mcg-config = { path = "../../../crates/mcg-config" }
mcg-codex-app-server = { path = "../../../crates/mcg-codex-app-server" }
mcg-domain = { path = "../../../crates/mcg-domain" }
mcg-events = { path = "../../../crates/mcg-events" }
mcg-mcp = { path = "../../../crates/mcg-mcp" }
mcg-providers = { path = "../../../crates/mcg-providers" }
mcg-runtime = { path = "../../../crates/mcg-runtime" }
mcg-tools = { path = "../../../crates/mcg-tools" }
mcg-updater = { path = "../../mcg-updater" }
minisign-verify.workspace = true
reqwest.workspace = true
base64.workspace = true
chrono.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-updater.workspace = true
tokio.workspace = true
uuid.workspace = true
webbrowser.workspace = true
zeroize.workspace = true

[dev-dependencies]
mcg-storage = { path = "../../../crates/mcg-storage" }
tempfile.workspace = true

[lints]
workspace = true
