[package]
name = "mcg-plugin-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["executor"]
executor = ["dep:mcg-plugins"]

[dependencies]
base64.workspace = true
mcg-plugin-protocol = { path = "../../crates/mcg-plugin-protocol" }
mcg-plugins = { path = "../../crates/mcg-plugins", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[[bin]]
name = "mcg-plugin-runner"
path = "src/main.rs"
required-features = ["executor"]

[lints]
workspace = true
